<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b8e6e"><link rel="manifest" href="manifest.json"><title>Menu della settimana</title><style>:root{--g:#6b8e6e;--bg:#f3f6f1;--line:#dce4d9}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#263128}main{max-width:760px;margin:auto;padding:18px}h1{margin:0 0 5px}.sub{color:#687568;margin-bottom:18px}.tabs,.days{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{border:0;border-radius:12px;padding:10px 14px;background:#fff;cursor:pointer}button.active{background:var(--g);color:#fff}.panel{background:#fff;border-radius:18px;padding:16px;margin-top:12px}.meal{border-top:1px solid var(--line);padding:12px 0}.meal:first-child{border-top:0}.meal strong{display:block;color:var(--g);margin-bottom:5px}.meal textarea{width:100%;min-height:55px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}.shopping label{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}</style></head><body><main><h1>Menu della settimana</h1><div class="sub">Menu personale e lista della spesa</div><div class="tabs"><button id="menuTab" class="active">Menu</button><button id="shopTab">Lista della spesa</button></div><section id="menuView"><div class="days" id="days"></div><div class="panel" id="dayPanel"></div></section><section id="shopView" hidden><div class="panel shopping"><h2>Lista della spesa</h2><p>Spunta gli alimenti acquistati.</p><div id="shoppingList"></div><button id="resetShop">Azzera spunte</button></div></section></main><script>
const menu={Lunedì:[['Colazione','Pane integrale 50 g + burro d’arachidi 10 g + marmellata 10 g'],['Spuntino','Finocchi crudi 200 g'],['Pranzo','Pasta integrale 60 g + tonno al naturale 80 g + pomodorini/zucchine 250 g + olio 5 g'],['Merenda','Una mela piccola, anche cotta al microonde'],['Cena','Petto di pollo 120 g + pane 50 g + carote/finocchi 250 g + olio 5 g']],Martedì:[['Colazione','Latte 150 ml + 2 Weetabix + banana piccola'],['Spuntino','Mandorle 15 g'],['Pranzo','Cous cous 60 g + ceci cotti 120 g + pomodorini/cetriolo + olio 5 g'],['Merenda','Yogurt bianco 125 g'],['Cena','Frittata di 2 uova + zucca 250 g + pane 50 g + olio 5 g']],Mercoledì:[['Colazione','Pane integrale 50 g + burro d’arachidi 10 g + banana piccola'],['Spuntino','Cetriolo 200 g'],['Pranzo','Pane integrale 70 g + ricotta 80 g + pomodorini/carote 250 g + olio 5 g'],['Merenda','Pesca 150 g'],['Cena','Calamari 180 g + pane 50 g + pomodorini/zucchine 250 g + olio 5 g']],Giovedì:[['Colazione','Latte 150 ml + 2 Weetabix + pesca 150 g'],['Spuntino','Noci 15 g'],['Pranzo','Riso basmati 60 g + lenticchie cotte 150 g + zucca/carote + olio 5 g'],['Merenda','Yogurt bianco 125 g'],['Cena','Bresaola 80 g + pane 60 g + verdure miste 250 g + olio 5 g']],Venerdì:[['Colazione','Pane integrale 50 g + burro d’arachidi 10 g + marmellata 10 g'],['Spuntino','Finocchi crudi 200 g'],['Pranzo','Patate lesse 200 g + mozzarella 100 g + pomodorini/insalata 250 g + olio 5 g'],['Merenda','Una mela cotta al microonde con cannella'],['Cena','Lenticchie 150 g + 1 uovo + pangrattato 10 g + pane 40 g + verdure 200 g + olio 5 g']],Sabato:[['Colazione','Yogurt bianco 125 g + pane integrale 50 g con marmellata 15 g'],['Spuntino','Mandorle 15 g'],['Pranzo','Piadina integrale 60 g + hummus 60 g + verdure grigliate'],['Merenda','Melone 200 g'],['Cena','Frittata di 2 uova + pane 50 g + zucchine/finocchi 250 g + olio 5 g']],Domenica:[['Colazione','Latte 150 ml + 2 Weetabix + uva 100 g'],['Spuntino','Cetriolo 200 g'],['Pranzo','Pane integrale 70 g + ricotta 80 g + pomodorini/carote 250 g + olio 5 g'],['Merenda','Una mela cotta al microonde'],['Cena','Uova strapazzate 2 + pane 50 g + zucchine/finocchi 250 g + olio 5 g']]};
const shopping=['Finocchi circa 1 kg','Cetrioli 2 grandi','Pomodorini circa 1 kg','Zucchine circa 1 kg','Carote circa 1 kg','Zucca 400–500 g','Insalata/rucola 1 confezione','Verdure da grigliare 300–400 g','Banane 2','Pesche 2','Uva 100 g','Melone 200 g','Mele 2','Pane integrale circa 700 g','Pasta integrale 60 g','Cous cous 60 g','Riso basmati 60 g','Weetabix 6 pezzi','Piadina integrale 1','Patate 200 g','Pangrattato 10 g','Ceci cotti 120 g','Lenticchie cotte 300 g','Hummus 60 g','Tonno 1 confezione','Calamari 180 g','Pollo 120 g','Bresaola 80 g','Uova 7','Yogurt 3 vasetti','Latte 450 ml','Ricotta 160 g','Mozzarella 100 g','Burro d’arachidi','Marmellata','Olio, cannella, aglio, limone, erbe aromatiche'];let day='Lunedì',saved=JSON.parse(localStorage.menu||'{}'),checked=JSON.parse(localStorage.spesa||'{}'),$=id=>document.getElementById(id);function days(){ $('days').innerHTML='';Object.keys(menu).forEach(d=>{let b=document.createElement('button');b.textContent=d.slice(0,3);b.className=d===day?'active':'';b.onclick=()=>{day=d;days();render()};$('days').append(b)})}function render(){let p=$('dayPanel');p.innerHTML='<h2>'+day+'</h2>';menu[day].forEach(([m,t],i)=>{let w=document.createElement('div');w.className='meal';let s=document.createElement('strong');s.textContent=m;let a=document.createElement('textarea');let k=day+i;a.value=saved[k]??t;a.oninput=()=>{saved[k]=a.value;localStorage.menu=JSON.stringify(saved)};w.append(s,a);p.append(w)})}function shop(){let p=$('shoppingList');p.innerHTML='';shopping.forEach((t,i)=>{let l=document.createElement('label'),c=document.createElement('input'),s=document.createElement('span');c.type='checkbox';c.checked=!!checked[i];c.onchange=()=>{checked[i]=c.checked;localStorage.spesa=JSON.stringify(checked)};s.textContent=t;l.append(c,s);p.append(l)})}$('menuTab').onclick=()=>{$('menuView').hidden=false;$('shopView').hidden=true;$('menuTab').classList.add('active');$('shopTab').classList.remove('active')};$('shopTab').onclick=()=>{$('menuView').hidden=true;$('shopView').hidden=false;$('shopTab').classList.add('active');$('menuTab').classList.remove('active');shop()};$('resetShop').onclick=()=>{checked={};localStorage.spesa='{}';shop()};days();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
